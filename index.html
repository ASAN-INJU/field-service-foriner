<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 전시대 순환봉사 배정표</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f4f6f8;color:#222;font-family:Arial,"Malgun Gothic",sans-serif}
main{max-width:1000px;margin:auto}
h1{text-align:center;font-size:22px}
h2{font-size:18px}
.panel{background:white;border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:12px}
#status{padding:10px;background:#eef5ff;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.person{display:grid;grid-template-columns:28px minmax(0,1fr) 80px;gap:6px;align-items:center}
input,select,textarea,button{font:inherit}
input[type=text],input[type=email],input[type=password],select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;min-width:0}
button{padding:10px 12px;border:0;border-radius:7px;background:#185abc;color:white;cursor:pointer;margin:3px}
.secondary{background:#5d6672}
.session-list{display:flex;gap:12px;flex-wrap:wrap}
.session-list label{display:flex;align-items:center;gap:5px}
.muted{font-size:13px;color:#666}
.table-wrap{overflow-x:auto}
table{width:100%;min-width:570px;border-collapse:collapse}
th,td{border:1px solid #ccd2d9;padding:7px 4px;text-align:center;font-size:13px;white-space:pre-line}
th{background:#eaf0f7}
.hidden{display:none!important}
.notice{white-space:pre-wrap;overflow-wrap:anywhere}
.login-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
label.field{display:block;font-size:13px}
@media(max-width:600px){
body{padding:7px}
.people{grid-template-columns:1fr}
.login-grid{grid-template-columns:1fr}
h1{font-size:20px}
.panel{padding:9px}
}
@media print{
.no-print{display:none!important}
body{background:white}
.panel{border:0}
}
</style>
</head>
<body>
<main>
<h1>오늘의 전시대 순환봉사 배정표</h1>
<div id="status">공유 자료 연결 중입니다.</div>

<section class="panel">
<h2>① 봉사 종류 선택</h2>
<p>참여할 봉사를 선택하세요. 여러 가지를 선택할 수 있습니다.</p>
<div class="session-list">
<label><input type="checkbox" id="wed" disabled checked> 수요일 저녁 18:00~20:00</label>
<label><input type="checkbox" id="satMorning" disabled checked> 토요일 오전 10:00~12:00</label>
<label><input type="checkbox" id="satEvening" disabled checked> 토요일 저녁 18:00~20:00</label>
</div>
<div id="sessionEdit" class="session-list hidden">
<label><input type="checkbox" id="editWed" checked> 수요일 저녁</label>
<label><input type="checkbox" id="editSatMorning" checked> 토요일 오전</label>
<label><input type="checkbox" id="editSatEvening" checked> 토요일 저녁</label>
</div>
</section>

<section class="panel">
<h2>② 참여자 이름 및 조 선택</h2>
<p class="muted">관리자로 로그인한 뒤 이름과 조를 수정하세요.</p>
<div id="people" class="people"></div>
</section>

<section class="panel">
<h2>③ 공지사항</h2>
<div id="noticeView" class="notice">등록된 공지사항이 없습니다.</div>
<div id="noticeEditWrap" class="hidden">
<textarea id="noticeEdit" rows="3" placeholder="공지사항 입력"></textarea>
</div>
</section>

<section class="panel">
<h2>④ 전체 순환봉사 배정표</h2>
<p class="muted">A 전시대: 영인면사무소 앞<br>B 전시대: 농협 하나로마트 앞<br>교대 간격: 15분</p>
<div id="scheduleTables"></div>
</section>

<section class="panel no-print">
<h2>⑤ 저장 및 공유</h2>
<p class="muted">관리자로 로그인하여 수정한 다음 저장하세요. 다른 사람은 같은 사이트 주소로 배정표를 볼 수 있습니다.</p>
<div id="loginPanel">
<form id="loginForm" class="login-grid">
<label class="field">관리자 이메일
<input id="email" type="email" required autocomplete="username">
</label>
<label class="field">비밀번호
<input id="password" type="password" required autocomplete="current-password">
</label>
<button type="submit">로그인</button>
</form>
</div>
<div id="adminPanel" class="hidden">
<p>관리자 로그인 완료</p>
<button id="saveBtn">변경사항 저장</button>
<button id="shareBtn">저장 및 공유 링크 복사</button>
<button id="reloadBtn" class="secondary">다시 불러오기</button>
<button id="logoutBtn" class="secondary">로그아웃</button>
<button class="secondary" onclick="window.print()">인쇄</button>
</div>
</section>
</main>

<script>
(function(){
"use strict";

const URL="https://vmeoivqwjghqdmzxtlop.supabase.co";
const KEY="sb_publishable_Cfz2TbYi2Lfz2L5E3R49BQ_V_jZxE1Y";
const db=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
const MAX=40;
const groups=[1,2,3,4];

const examples=[
{name:"김진석",group:1},{name:"이순희",group:1},
{name:"고원섭",group:2},{name:"배영옥",group:2},
{name:"이희락",group:3},{name:"조혜숙",group:3},
{name:"김국진",group:4},{name:"정영실",group:4}
];

let people=Array.from({length:MAX},(_,i)=>examples[i]||{name:"",group:1});
let notice="";
let sessions={wed:true,satMorning:true,satEvening:true};
let admin=false;
let user=null;
let saving=false;

const rotation=[
["A","가두봉사","B","휴식"],
["가두봉사","B","휴식","A"],
["B","휴식","A","가두봉사"],
["휴식","A","가두봉사","B"]
];

const sessionInfo={
wed:{title:"수요일 저녁 봉사 (18:00 시작)",start:1080},
satMorning:{title:"토요일 오전 봉사 (10:00 시작)",start:600},
satEvening:{title:"토요일 저녁 봉사 (18:00 시작)",start:1080}
};

function status(msg,error=false){
$("status").textContent=msg;
$("status").style.background=error?"#fff0f0":"#eef5ff";
$("status").style.color=error?"#8b1d1d":"#222";
}

function renderPeople(){
const box=$("people");
box.replaceChildren();

people.forEach((p,i)=>{
const row=document.createElement("div");
row.className="person";

const number=document.createElement("span");
number.textContent=i+1;

const name=document.createElement("input");
name.type="text";
name.placeholder="이름 입력";
name.maxLength=80;
name.value=p.name;
name.disabled=!admin;
name.addEventListener("input",()=>{
people[i].name=name.value;
renderSchedule();
});

const group=document.createElement("select");
group.disabled=!admin;
group.setAttribute("aria-label",(i+1)+"번 참여자 조");

groups.forEach(g=>{
const op=document.createElement("option");
op.value=g;
op.textContent=g+"조";
group.appendChild(op);
});

group.value=p.group;
group.addEventListener("change",()=>{
people[i].group=Number(group.value);
renderSchedule();
});

row.append(number,name,group);
box.appendChild(row);
});
}

function fmt(n){
return String(Math.floor(n/60)).padStart(2,"0")+":"+
String(n%60).padStart(2,"0");
}

function groupNames(g){
const names=people.filter(p=>p.group===g&&p.name.trim()).map(p=>p.name.trim());
return names.length?names.join(", "):"—";
}

function makeTable(key){
const info=sessionInfo[key];
const section=document.createElement("div");
section.style.marginBottom="20px";

const title=document.createElement("h3");
title.textContent=info.title;
section.appendChild(title);

const wrap=document.createElement("div");
wrap.className="table-wrap";

const table=document.createElement("table");
const thead=document.createElement("thead");
const hr=document.createElement("tr");

["시간","1조","2조","3조","4조"].forEach(t=>{
const th=document.createElement("th");
th.textContent=t;
hr.appendChild(th);
});

thead.appendChild(hr);
table.appendChild(thead);

const tbody=document.createElement("tbody");

for(let step=0;step<8;step++){
const tr=document.createElement("tr");
const tdtime=document.createElement("td");
tdtime.textContent=fmt(info.start+step*15)+"~"+fmt(info.start+(step+1)*15);
tr.appendChild(tdtime);

for(let g=1;g<=4;g++){
const td=document.createElement("td");
const role=rotation[step%4][g-1];
let place=role;
if(role==="A")place="A 전시대\n영인면사무소 앞";
if(role==="B")place="B 전시대\n농협 하나로마트 앞";
td.textContent=place+"\n"+groupNames(g);
tr.appendChild(td);
}

tbody.appendChild(tr);
}

table.appendChild(tbody);
wrap.appendChild(table);
section.appendChild(wrap);
return section;
}

function renderSchedule(){
const box=$("scheduleTables");
box.replaceChildren();
let count=0;

Object.keys(sessionInfo).forEach(key=>{
if(sessions[key]){
box.appendChild(makeTable(key));
count++;
}
});

if(!count)box.textContent="관리자가 봉사 일정을 선택하지 않았습니다.";
}

function render(){
renderPeople();
$("noticeView").textContent=notice.trim()||"등록된 공지사항이 없습니다.";
$("noticeEdit").value=notice;
$("noticeEditWrap").classList.toggle("hidden",!admin);
$("sessionEdit").classList.toggle("hidden",!admin);
$("adminPanel").classList.toggle("hidden",!admin);
$("loginPanel").classList.toggle("hidden",!!user);

$("wed").checked=!!sessions.wed;
$("satMorning").checked=!!sessions.satMorning;
$("satEvening").checked=!!sessions.satEvening;
$("editWed").checked=!!sessions.wed;
$("editSatMorning").checked=!!sessions.satMorning;
$("editSatEvening").checked=!!sessions.satEvening;
renderSchedule();
}

async function load(){
status("공유 자료를 불러오는 중입니다…");

const result=await db.from("volunteer_plan")
.select("id,participants,notice,schedule,updated_at")
.eq("id",1).maybeSingle();

if(result.error){
status("연결 오류: "+result.error.message,true);
return;
}
if(!result.data){
status("Supabase에 volunteer_plan의 id=1 자료가 없습니다.",true);
return;
}

const data=result.data;
const saved=Array.isArray(data.participants)?data.participants:[];
people=Array.from({length:MAX},(_,i)=>{
const p=saved[i];
return p?{name:typeof p.name==="string"?p.name:"",group:groups.includes(Number(p.group))?Number(p.group):1}:
(examples[i]||{name:"",group:1});
});
if(!people.some(p=>p.name.trim()))people=Array.from({length:MAX},(_,i)=>examples[i]||{name:"",group:1});

notice=typeof data.notice==="string"?data.notice:"";
sessions={wed:true,satMorning:true,satEvening:true,...(data.schedule||{})};
render();
status("공유 자료 연결 완료 · 마지막 저장: "+(data.updated_at?new Date(data.updated_at).toLocaleString("ko-KR"):"정보 없음"));
}

async function checkAdmin(){
const result=await db.auth.getUser();
user=result.data.user||null;
admin=false;

if(user){
const a=await db.from("volunteer_admins").select("user_id").eq("user_id",user.id).maybeSingle();
admin=!!a.data&&!a.error;
}
render();
}

async function save(){
if(!admin){
status("관리자 로그인 후 저장할 수 있습니다.",true);
return false;
}
if(saving)return false;
saving=true;
$("saveBtn").disabled=true;
status("저장 중입니다…");

const newSessions={
wed:$("editWed").checked,
satMorning:$("editSatMorning").checked,
satEvening:$("editSatEvening").checked
};
const newNotice=$("noticeEdit").value.slice(0,3000);

const result=await db.from("volunteer_plan").update({
participants:people,
notice:newNotice,
schedule:newSessions,
updated_at:new Date().toISOString()
}).eq("id",1).select("id,updated_at").maybeSingle();

saving=false;
$("saveBtn").disabled=false;

if(result.error){
status("저장 실패: "+result.error.message,true);
return false;
}
if(!result.data){
status("저장되지 않았습니다. 관리자 권한을 확인하세요.",true);
return false;
}

notice=newNotice;
sessions=newSessions;
render();
status("저장 완료! 다른 휴대폰에서도 같은 주소로 확인할 수 있습니다.");
return true;
}

$("loginForm").addEventListener("submit",async e=>{
e.preventDefault();
status("로그인 중입니다…");

const result=await db.auth.signInWithPassword({
email:$("email").value.trim(),
password:$("password").value
});

if(result.error){
status("로그인 실패: "+result.error.message,true);
return;
}

await checkAdmin();
if(admin)status("관리자 로그인 완료");
else status("로그인은 되었지만 관리자 권한이 없습니다. Supabase 설정을 확인하세요.",true);
});

$("saveBtn").addEventListener("click",save);

$("shareBtn").addEventListener("click",async()=>{
const ok=await save();
if(!ok)return;
const link=location.href.split("?")[0];
try{
await navigator.clipboard.writeText(link);
status("저장 완료! 공유 링크를 복사했습니다. 카카오톡에 붙여넣어 보내세요.");
}catch(e){
window.prompt("아래 링크를 복사해 공유하세요.",link);
}
});

$("reloadBtn").addEventListener("click",load);

$("logoutBtn").addEventListener("click",async()=>{
await db.auth.signOut();
user=null;
admin=false;
render();
status("로그아웃했습니다. 읽기 전용 상태입니다.");
});

db.auth.onAuthStateChange(()=>{
setTimeout(checkAdmin,0);
});

async function start(){
await checkAdmin();
await load();

db.channel("volunteer-plan-live")
.on("postgres_changes",{
event:"*",schema:"public",table:"volunteer_plan",filter:"id=eq.1"
},load)
.subscribe(state=>{
if(state==="CHANNEL_ERROR"||state==="TIMED_OUT"){
status("자료는 불러왔지만 실시간 알림 연결이 안 됐습니다. 새로고침해 확인하세요.",true);
}
});
}

start().catch(e=>status("오류: "+e.message,true));
})();
</script>
</body>
</html>
