<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>외국어 봉사 앱 - 즉시 음성</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;background:#f4f7fb;color:#111}header{background:#123c69;color:white;padding:18px 14px;text-align:center}header h1{margin:0;font-size:23px}header p{margin:8px 0 0;font-size:14px;opacity:.9}.wrap{max-width:720px;margin:0 auto;padding:14px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tab{border:0;border-radius:14px;padding:14px 8px;font-size:16px;font-weight:800;background:white;color:#123c69;box-shadow:0 2px 8px rgba(0,0,0,.08)}.tab.active{background:#123c69;color:white}.notice{background:#fff6dc;border:1px solid #f1d38b;padding:12px;border-radius:14px;font-size:14px;line-height:1.6;margin-bottom:12px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 12px rgba(0,0,0,.08)}.num{display:inline-block;background:#e8f1fb;color:#123c69;font-weight:900;padding:5px 10px;border-radius:999px;margin-bottom:8px}.ko{font-size:19px;font-weight:800;line-height:1.55;margin:8px 0}.local{font-size:22px;line-height:1.7;margin:12px 0;padding:12px;background:#f7f9fc;border-radius:12px}.pron{font-size:15px;color:#555;line-height:1.6;margin-top:8px}.btns{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:11px 14px;font-size:16px;font-weight:800}.speak{background:#0b7a3b;color:white}.copy{background:#eceff3;color:#222}.stop{background:#c62828;color:white}.open{background:#174ea6;color:white}.footer{text-align:center;color:#666;font-size:13px;margin:20px 0}audio{width:100%;margin-top:8px;background:white;border-radius:12px}
</style></head>
<body>
<header><h1>🌍 외국어 봉사 앱</h1><p>네팔어 · 힌디어 · 벵골어 / 즉시 음성 재생</p></header>
<div class="wrap">
<div class="tabs"><button class="tab active" onclick="selectLang('ne')">🇳🇵 네팔</button><button class="tab" onclick="selectLang('hi')">🇮🇳 인도</button><button class="tab" onclick="selectLang('bn')">🇧🇩 방글라데시</button></div>
<div class="notice">🔊 이번 버전은 브라우저 기본 음성이 아니라 <b>인터넷 음성 링크</b>로 재생합니다. 안 들리면 <b>새 창 듣기</b>를 누르세요.</div>
<audio id="player" controls></audio>
<div id="cards"></div><div class="footer">ZIP 안의 index.html을 GitHub에 올리세요.</div></div>
<script>
const data = {"ne": {"name": "네팔어", "tl": "ne", "items": [["안녕하세요! 저는 성경을 하느님이 주신 책으로 믿는 여호와의 증인의 한 사람입니다.", "नमस्ते! म परमेश्वरले दिनुभएको पुस्तकको रूपमा बाइबलमा विश्वास गर्ने यहोवाको साक्षीहरूमध्ये एक हुँ।", "나마스떼! 마 파르메슈와르레 디누바예코 푸스타크코 루프마 바이벌마 비슈와스 거르네 예호바코 삭시하루마디예 엑 후."], ["혹시, 성경을 읽어 보신 적 있나요?", "के तपाईंले कहिल्यै बाइबल पढ्नुभएको छ?", "께 따빠이늘레 까힐례 바이벌 빠드누바예코 차?"], ["성경은 우리가 살아가면서 생기는 중요한 질문들에 대한 답을 알려줍니다.", "बाइबलले जीवनका महत्त्वपूर्ण प्रश्नहरूको उत्तर दिन्छ।", "바이벌레 지완카 마하트워푸르나 프라슈나하루코 우타르 딘차."], ["예를 들면, 사람이 죽으면 어떻게 되는가?", "उदाहरणका लागि, मानिस मरेपछि के हुन्छ?", "우다하란카 라기, 마니스 마레파치 께 훈차?"], ["하느님은 우리가 살고 있는 세상에 대해, 사람들에 대해 과연 관심이 있으신가?", "के परमेश्वरलाई हामी बसिरहेको संसार र मानिसहरूको साँच्चै चासो छ?", "께 파르메슈와르라이 하미 바시라헤코 산사르 라 마니스하루코 산차이 차소 차?"], ["괜찮으시다면 매주 한 번 10분 정도 무료로 성경을 알려드릴 수 있어요.", "यदि तपाईंलाई ठीक लाग्छ भने, हामी हप्तामा एक पटक करिब १० मिनेट जति निःशुल्क बाइबलबारे छलफल गर्न सक्छौं।", "야디 따빠이늘라이 틱 락차 바네, 하미 합타마 엑 파탁 카립 다스 미닛 자티 니슐카 바이벌바레 찰팔 거르나 삭차우."]]}, "hi": {"name": "힌디어", "tl": "hi", "items": [["안녕하세요! 저는 성경을 하느님이 주신 책으로 믿는 여호와의 증인의 한 사람입니다.", "नमस्ते! मैं यहोवा का एक साक्षी हूँ और मेरा विश्वास है कि बाइबल परमेश्वर द्वारा दी गई पुस्तक है।", "나마스떼! 메인 예호바 카 엑 삭시 훈, 아우르 메라 비슈와스 해 끼 바이벌 파르메슈와르 드와라 디 가이 푸스타크 해."], ["혹시, 성경을 읽어 보신 적 있나요?", "क्या आपने कभी बाइबल पढ़ी है?", "꺄 아프네 까비 바이벌 빠디 해?"], ["성경은 우리가 살아가면서 생기는 중요한 질문들에 대한 답을 알려줍니다.", "बाइबल जीवन के महत्वपूर्ण प्रश्नों के उत्तर देती है।", "바이벌 지완 께 마하트와푸르나 프라슈논 께 우타르 데티 해."], ["예를 들면, 사람이 죽으면 어떻게 되는가?", "उदाहरण के लिए, मरने के बाद क्या होता है?", "우다하란 께 리예, 마르네 께 바드 꺄 호타 해?"], ["하느님은 우리가 살고 있는 세상에 대해, 사람들에 대해 과연 관심이 있으신가?", "क्या परमेश्वर को हमारी और इस दुनिया की सचमुच परवाह है?", "꺄 파르메슈와르 꼬 하마리 아우르 이스 두니야 키 사치무치 파르와 해?"], ["괜찮으시다면 매주 한 번 10분 정도 무료로 성경을 알려드릴 수 있어요.", "अगर आपको ठीक लगे, तो हम सप्ताह में एक बार लगभग 10 मिनट के लिए निःशुल्क बाइबल के बारे में चर्चा कर सकते हैं।", "아가르 아프꼬 틱 라게, 또 함 삽타흐 메인 엑 바르 라그박 다스 미닛 께 리예 니슐크 바이벌 께 바레 메인 차르차 까르 삭테 해."]]}, "bn": {"name": "벵골어", "tl": "bn", "items": [["안녕하세요! 저는 성경을 하느님이 주신 책으로 믿는 여호와의 증인의 한 사람입니다.", "নমস্কার! আমি যিহোবার একজন সাক্ষি। আমি বিশ্বাস করি, বাইবেল হলো ঈশ্বরের দেওয়া বই।", "노모스카르! 아미 지호바르 엑존 삭키. 아미 비슈와스 코리, 바이벨 홀로 이슈워레르 데오아 보이."], ["혹시, 성경을 읽어 보신 적 있나요?", "আপনি কি কখনও বাইবেল পড়েছেন?", "압니 끼 코코노 바이벨 포레첸?"], ["성경은 우리가 살아가면서 생기는 중요한 질문들에 대한 답을 알려줍니다.", "বাইবেল জীবনের গুরুত্বপূর্ণ প্রশ্নগুলোর উত্তর দেয়।", "바이벨 지보네르 구루토푸르노 프로슈노굴로르 우토르 데이."], ["예를 들면, 사람이 죽으면 어떻게 되는가?", "উদাহরণস্বরূপ, মানুষ মারা গেলে কী হয়?", "우다하론쇼룹, 마누시 마라 겔레 끼 호이?"], ["하느님은 우리가 살고 있는 세상에 대해, 사람들에 대해 과연 관심이 있으신가?", "ঈশ্বর কি আমাদের এবং আমরা যে পৃথিবীতে বাস করি, সে সম্পর্কে সত্যিই যত্নশীল?", "이슈워르 끼 아마데르 에봉 암라 제 프리티비테 바스 코리, 셰 쇼므포르케 쇼티이 조트노실?"], ["괜찮으시다면 매주 한 번 10분 정도 무료로 성경을 알려드릴 수 있어요.", "আপনার যদি আপত্তি না থাকে, তাহলে আমরা সপ্তাহে একবার প্রায় ১০ মিনিট বিনামূল্যে বাইবেল নিয়ে আলোচনা করতে পারি।", "압나르 조디 아폿티 나 타케, 타홀레 암라 쇼프타헤 엑바르 프라이 도쉬 미닛 비나물례 바이벨 니예 알로초나 코르테 파리."]]}};
let current = "ne";
function ttsUrl(text, tl){return "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+encodeURIComponent(tl)+"&q="+encodeURIComponent(text);}
function selectLang(code){current=code;document.querySelectorAll(".tab").forEach((b,i)=>b.classList.toggle("active",["ne","hi","bn"][i]===code));render();}
function render(){const box=document.getElementById("cards");const d=data[current];box.innerHTML=d.items.map((it,idx)=>`<div class="card"><span class="num">${idx+1}</span><div class="ko">${esc(it[0])}</div><div class="local">${esc(it[1])}</div><div class="pron">한글 발음: ${esc(it[2])}</div><div class="btns"><button class="speak" onclick="playVoice(${idx})">🔊 듣기</button><button class="open" onclick="openVoice(${idx})">↗ 새 창 듣기</button><button class="copy" onclick="copyText(${idx})">📋 복사</button><button class="stop" onclick="stopVoice()">■ 정지</button></div></div>`).join("");}
function playVoice(idx){const d=data[current];const p=document.getElementById("player");p.src=ttsUrl(d.items[idx][1],d.tl);p.play().catch(()=>alert("자동 재생이 막혔습니다. 새 창 듣기를 눌러주세요."));}
function openVoice(idx){const d=data[current];window.open(ttsUrl(d.items[idx][1],d.tl),"_blank");}
function stopVoice(){const p=document.getElementById("player");p.pause();p.currentTime=0;}
function copyText(idx){navigator.clipboard.writeText(data[current].items[idx][1]).then(()=>alert("복사되었습니다."));}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
render();
</script></body></html>
