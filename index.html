<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>성경 대화 도우미 v1.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;background:#f4f7fb;color:#111}
body.dark{background:#111827;color:#f9fafb}
header{background:#123c69;color:white;padding:18px 14px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:23px}
header p{margin:8px 0 0;font-size:14px;opacity:.9}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lang{border:0;border-radius:14px;padding:14px 6px;font-size:16px;font-weight:900;background:white;color:#123c69;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.lang.active{background:#123c69;color:white}
.panel{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.dark .panel,.dark .lang{background:#1f2937;color:#f9fafb}
.notice{background:#fff6dc;border:1px solid #f1d38b;padding:12px;border-radius:14px;font-size:14px;line-height:1.6;margin-bottom:12px;color:#111}
.num{display:inline-block;background:#e8f1fb;color:#123c69;font-weight:900;padding:6px 12px;border-radius:999px;margin-bottom:8px}
.ko{font-size:20px;font-weight:900;line-height:1.65;margin:8px 0;white-space:pre-line}
.local{font-size:23px;line-height:1.75;margin:12px 0;padding:12px;background:#f7f9fc;border-radius:12px;white-space:pre-line}
.dark .local{background:#111827}
.pron{font-size:15px;color:#555;line-height:1.7;margin-top:8px}
.dark .pron{color:#cbd5e1}
.btns,.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:900}
.speak{background:#0b7a3b;color:white}
.copy{background:#eceff3;color:#222}
.stop{background:#c62828;color:white}
.nav button{background:#123c69;color:white;flex:1}
.tool{background:#6b7280;color:white}
.big .ko{font-size:24px} .big .local{font-size:28px} .big .pron{font-size:18px}
audio{width:100%;margin-top:8px;background:white;border-radius:12px}
.footer{text-align:center;color:#666;font-size:13px;margin:20px 0}
</style>
</head>
<body>
<header>
<h1>🌍 성경 대화 도우미</h1>
<p>네팔어 · 힌디어 · 벵골어 / MP3 음성 포함</p>
</header>
<div class="wrap">
<div class="langs">
<button class="lang active" onclick="setLang('ne')">🇳🇵 네팔</button>
<button class="lang" onclick="setLang('hi')">🇮🇳 인도</button>
<button class="lang" onclick="setLang('bn')">🇧🇩 방글라데시</button>
</div>

<audio id="player" controls></audio>
<div class="btns">
<button class="tool" onclick="toggleBig()">🔤 글자 크게</button>
<button class="tool" onclick="toggleDark()">🌙 야간모드</button>
<button class="stop" onclick="stopVoice()">■ 정지</button>
</div>
<div id="content"></div>
<div class="nav">
<button onclick="prevItem()">⬅️ 이전</button>
<button onclick="nextItem()">다음 ➡️</button>
</div>
<div class="footer">Bible Conversation Helper v1.0</div>
</div>
<script>

let current="ne", index=0, isBig=false, isDark=false;
function setLang(code){current=code;index=0;document.querySelectorAll(".lang").forEach((b,i)=>b.classList.toggle("active",["ne","hi","bn"][i]===code));render();}
function render(){
 const item=data[current].items[index];
 const el=document.getElementById("content");
 el.innerHTML=`<div class="panel"><span class="num">${index+1} / ${data[current].items.length}</span>
 <div class="ko">${esc(item.ko)}</div>
 <div class="local">${esc(item.local)}</div>
 <div class="pron">한글 발음: ${esc(item.pron)}</div>
 <div class="btns"><button class="speak" onclick="playVoice()">🔊 듣기</button><button class="copy" onclick="copyLocal()">📋 현지어 복사</button></div></div>`;
}
function playVoice(){
 const p=document.getElementById("player");
 p.src=`audio/${current}/${String(index+1).padStart(2,'0')}.mp3`;
 p.play().catch(()=>alert("재생이 막혔습니다. 화면의 플레이어 ▶ 버튼을 눌러주세요."));
}
function stopVoice(){const p=document.getElementById("player");p.pause();p.currentTime=0;}
function prevItem(){if(index>0) index--; render(); window.scrollTo(0,0);}
function nextItem(){if(index<data[current].items.length-1) index++; render(); window.scrollTo(0,0);}
function copyLocal(){navigator.clipboard.writeText(data[current].items[index].local).then(()=>alert("복사되었습니다."));}
function toggleBig(){isBig=!isBig;document.body.classList.toggle("big",isBig);}
function toggleDark(){isDark=!isDark;document.body.classList.toggle("dark",isDark);}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
render();
</script>
