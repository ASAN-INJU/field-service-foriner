<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 전시대 순환봉사 배정표</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Arial,"Malgun Gothic",sans-serif;color:#222;background:#f4f6f8}
*{box-sizing:border-box}
body{margin:0;padding:14px}
main{max-width:1050px;margin:0 auto}
h1{font-size:22px;text-align:center;margin:8px 0 14px}
h2{font-size:18px;margin:0 0 10px}
.panel{background:white;border:1px solid #d9dee5;border-radius:12px;padding:14px;margin-bottom:12px}
.status{background:#eef5ff;border-radius:8px;padding:10px;margin-bottom:12px;font-size:14px;overflow-wrap:anywhere}
.muted{color:#666;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit}
input[type="text"],input[type="email"],input[type="password"],select,textarea{width:100%;min-width:0;border:1px solid #c9d0d9;border-radius:7px;padding:9px;background:white}
button{border:0;border-radius:8px;padding:10px 13px;background:#185abc;color:white;cursor:pointer}
button.secondary{background:#5d6672}
button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.65;cursor:not-allowed}
.login-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.field label{display:block;font-size:13px;margin-bottom:5px}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.person{display:grid;grid-template-columns:36px minmax(0,1fr) 92px;gap:7px;align-items:center}
.person-num{color:#555;font-size:13px;text-align:center}
.session-list{display:flex;flex-wrap:wrap;gap:10px 18px}
.session-list label{display:flex;gap:7px;align-items:center}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px;background:white}
th,td{border:1px solid #d5dbe2;padding:8px 6px;text-align:center;font-size:13px}
th{background:#eaf0f7}
.notice{white-space:pre-wrap;overflow-wrap:anywhere}
.hidden{display:none!important}
@media(max-width:620px){
body{padding:8px}
h1{font-size:20px}
.panel{padding:10px}
.people{grid-template-columns:1fr}
.login-grid{grid-template-columns:1fr}
.person{grid-template-columns:30px minmax(0,1fr) 82px}
th,td{padding:7px 4px;font-size:12px}
}
@media print{
body{background:white;padding:0}
.no-print,#adminPanel,#loginPanel{display:none!important}
.panel{border:0;padding:0}
}
</style>
</head>
<body>
<main>
<h1>오늘의 전시대 순환봉사 배정표</h1>
<div id="status" class="status" role="status">공유 자료를 불러오는 중입니다…</div>

<section class="panel">
<h2>봉사 일정</h2>
<div class="session-list">
<label><input type="checkbox" id="wed" checked disabled> 수요일 18:00~20:00</label>
<label><input type="checkbox" id="satMorning" checked disabled> 토요일 10:00~12:00</label>
<label><input type="checkbox" id="satEvening" checked disabled> 토요일 18:00~20:00</label>
</div>
<p class="muted">15분씩 교대합니다. 같은 링크에서 최신 배정표를 확인할 수 있습니다.</p>
</section>

<section class="panel">
<h2>참여자 명단 및 조 편성</h2>
<p class="muted">관리자로 로그인하면 이름과 조를 수정할 수 있습니다.</p>
<div id="people" class="people"></div>
</section>

<section class="panel">
<h2>공지사항</h2>
<div id="noticeView" class="notice">등록된 공지사항이 없습니다.</div>
<div id="noticeEditWrap" class="hidden no-print" style="margin-top:10px">
<label for="noticeEdit">공지사항 수정</label>
<textarea id="noticeEdit" rows="3" placeholder="공지사항을 입력하세요."></textarea>
</div>
</section>

<section class="panel">
<h2>전체 순환봉사 배정표</h2>
<div id="scheduleTables"></div>
</section>

<section class="panel no-print" id="loginPanel">
<h2>관리자 로그인</h2>
<p class="muted">일반 방문자는 로그인하지 않아도 배정표를 볼 수 있습니다.</p>
<form id="loginForm" class="login-grid">
<div class="field">
<label for="email">관리자 이메일</label>
<input id="email" type="email" autocomplete="username" required>
</div>
<div class="field">
<label for="password">비밀번호</label>
<input id="password" type="password" autocomplete="current-password" required>
</div>
<button type="submit">로그인</button>
</form>
<div class="row" style="margin-top:10px">
<button type="button" class="secondary hidden" id="logoutBtn">로그아웃</button>
<span id="adminStatus" class="muted">읽기 전용</span>
</div>
</section>

<section class="panel no-print hidden" id="adminPanel">
<h2>관리자 편집</h2>
<p class="muted">수정한 뒤 저장하면 공유 자료가 업데이트됩니다.</p>
<div class="session-list" style="margin-bottom:12px">
<label><input type="checkbox" id="editWed" checked> 수요일 18:00~20:00</label>
<label><input type="checkbox" id="editSatMorning" checked> 토요일 10:00~12:00</label>
<label><input type="checkbox" id="editSatEvening" checked> 토요일 18:00~20:00</label>
</div>
<div class="row">
<button type="button" id="saveBtn">변경사항 저장</button>
<button type="button" class="secondary" id="reloadBtn">다시 불러오기</button>
<button type="button" class="secondary" onclick="window.print()">인쇄</button>
</div>
</section>
</main>

<script>
(() => {
"use strict";

const SUPABASE_URL = "https://vmeoivqwjghqdmzxtlop.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Cfz2TbYi2Lfz2L5E3R49BQ_V_jZxE1Y";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = id => document.getElementById(id);
const statusEl = $("status");
const MAX_PEOPLE = 40;
const GROUPS = [1,2,3,4];

const ROTATION = [
["A","가두봉사","B","휴식"],
["가두봉사","B","휴식","A"],
["B","휴식","A","가두봉사"],
["휴식","A","가두봉사","B"]
];

const SESSION_INFO = {
wed:{title:"수요일 18:00~20:00",start:18*60},
satMorning:{title:"토요일 10:00~12:00",start:10*60},
satEvening:{title:"토요일 18:00~20:00",start:18*60}
};

let participants = Array.from({length:MAX_PEOPLE},()=>({name:"",group:1}));
let notice = "";
let schedule = {wed:true,satMorning:true,satEvening:true};
let isAdmin = false;
let currentUser = null;
let saveInProgress = false;

function setStatus(message,isError=false){
statusEl.textContent=message;
statusEl.style.background=isError?"#fff0f0":"#eef5ff";
statusEl.style.color=isError?"#8b1d1d":"#222";
}

function normalizedPeople(input){
return Array.from({length:MAX_PEOPLE},(_,i)=>{
const item=Array.isArray(input)?input[i]:null;
return {
name:item&&typeof item.name==="string"?item.name.slice(0,80):"",
group:item&&GROUPS.includes(Number(item.group))?Number(item.group):1
};
});
}

function renderPeople(){
const container=$("people");
container.replaceChildren();

participants.forEach((person,index)=>{
const row=document.createElement("div");
row.className="person";

const number=document.createElement("div");
number.className="person-num";
number.textContent=String(index+1);

const name=document.createElement("input");
name.type="text";
name.maxLength=80;
name.placeholder="이름 입력";
name.value=person.name;
name.setAttribute("aria-label",`${index+1}번 참여자 이름`);
name.disabled=!isAdmin;
name.addEventListener("input",()=>{
participants[index].name=name.value;
renderSchedule();
});

const group=document.createElement("select");
group.setAttribute("aria-label",`${index+1}번 참여자 조`);
group.disabled=!isAdmin;

GROUPS.forEach(g=>{
const option=document.createElement("option");
option.value=String(g);
option.textContent=`${g}조`;
group.appendChild(option);
});

group.value=String(person.group);
group.addEventListener("change",()=>{
participants[index].group=Number(group.value);
renderSchedule();
});

row.append(number,name,group);
container.appendChild(row);
});
}

function timeText(minutes){
const h=Math.floor(minutes/60);
const m=minutes%60;
return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}

function namesForGroup(group){
const names=participants
.filter(p=>p.group===group&&p.name.trim())
.map(p=>p.name.trim());
return names.length?names.join(", "):"—";
}

function renderOneSchedule(key){
const info=SESSION_INFO[key];
const wrap=document.createElement("div");
wrap.style.marginBottom="18px";

const heading=document.createElement("h3");
heading.textContent=info.title;
heading.style.fontSize="16px";
wrap.appendChild(heading);

const tableWrap=document.createElement("div");
tableWrap.className="table-wrap";

const table=document.createElement("table");
const thead=document.createElement("thead");
const header=document.createElement("tr");

["시간","1조","2조","3조","4조"].forEach(text=>{
const th=document.createElement("th");
th.textContent=text;
header.appendChild(th);
});

thead.appendChild(header);
table.appendChild(thead);

const tbody=document.createElement("tbody");

for(let step=0;step<8;step++){
const tr=document.createElement("tr");
const time=document.createElement("td");

time.textContent=
`${timeText(info.start+step*15)}~${timeText(info.start+(step+1)*15)}`;
tr.appendChild(time);

for(let group=1;group<=4;group++){
const td=document.createElement("td");
const role=ROTATION[step%4][group-1];

const place=role==="A"?"A 전시대\n영인면사무소 앞":
role==="B"?"B 전시대\n농협 하나로마트 앞":role;

td.style.whiteSpace="pre-line";
td.textContent=`${place}\n${namesForGroup(group)}`;
tr.appendChild(td);
}
tbody.appendChild(tr);
}

table.appendChild(tbody);
tableWrap.appendChild(table);
wrap.appendChild(tableWrap);
return wrap;
}

function renderSchedule(){
const container=$("scheduleTables");
container.replaceChildren();

const enabled=Object.keys(SESSION_INFO).filter(key=>schedule[key]);

if(!enabled.length){
container.textContent="관리자가 표시할 일정을 선택하지 않았습니다.";
return;
}

enabled.forEach(key=>container.appendChild(renderOneSchedule(key)));
}

function renderAll(){
renderPeople();
$("noticeView").textContent=notice.trim()||"등록된 공지사항이 없습니다.";
$("noticeEdit").value=notice;
$("noticeEditWrap").classList.toggle("hidden",!isAdmin);
$("adminPanel").classList.toggle("hidden",!isAdmin);
$("logoutBtn").classList.toggle("hidden",!currentUser);
$("adminStatus").textContent=isAdmin?"관리자 편집 가능":"읽기 전용";

$("wed").checked=!!schedule.wed;
$("satMorning").checked=!!schedule.satMorning;
$("satEvening").checked=!!schedule.satEvening;

$("editWed").checked=!!schedule.wed;
$("editSatMorning").checked=!!schedule.satMorning;
$("editSatEvening").checked=!!schedule.satEvening;

renderSchedule();
}

async function loadPlan(showStatus=true){
if(showStatus)setStatus("공유 자료를 불러오는 중입니다…");

const {data,error}=await db.from("volunteer_plan")
.select("id,participants,notice,schedule,updated_at")
.eq("id",1).maybeSingle();

if(error){
setStatus("불러오기 실패: "+error.message+" — Supabase 테이블과 공개 읽기 정책을 확인하세요.",true);
return false;
}

if(!data){
setStatus("공유 자료가 없습니다. Supabase에 volunteer_plan의 id=1 행이 있는지 확인하세요.",true);
return false;
}

participants=normalizedPeople(data.participants);
notice=typeof data.notice==="string"?data.notice:"";
schedule={wed:true,satMorning:true,satEvening:true,...(data.schedule||{})};

renderAll();

const updated=data.updated_at?
new Date(data.updated_at).toLocaleString("ko-KR"):"시간 정보 없음";

setStatus(`공유 자료 연결 완료 · 마지막 저장: ${updated}`);
return true;
}

async function checkAdmin(){
const {data:{user},error}=await db.auth.getUser();
currentUser=user||null;
isAdmin=false;

if(user&&!error){
const {data, error:adminError}=await db.from("volunteer_admins")
.select("user_id").eq("user_id",user.id).maybeSingle();
isAdmin=!!data&&!adminError;
}

renderAll();
return isAdmin;
}

async function savePlan(){
if(!isAdmin){
setStatus("관리자로 로그인한 뒤 저장할 수 있습니다.",true);
return;
}
if(saveInProgress)return;

saveInProgress=true;
$("saveBtn").disabled=true;
setStatus("변경사항을 저장하는 중입니다…");

const newSchedule={
wed:$("editWed").checked,
satMorning:$("editSatMorning").checked,
satEvening:$("editSatEvening").checked
};

const newNotice=$("noticeEdit").value.slice(0,3000);

const {data,error}=await db.from("volunteer_plan").update({
participants,
notice:newNotice,
schedule:newSchedule,
updated_at:new Date().toISOString()
}).eq("id",1).select("id,updated_at").maybeSingle();

saveInProgress=false;
$("saveBtn").disabled=false;

if(error){
setStatus("저장 실패: "+error.message+" — 관리자 등록과 UPDATE 정책을 확인하세요.",true);
return;
}

if(!data){
setStatus("저장되지 않았습니다. Supabase volunteer_admins에 관리자 계정이 등록되어 있는지 확인하세요.",true);
return;
}

notice=newNotice;
schedule=newSchedule;
renderAll();

const updated=data.updated_at?
new Date(data.updated_at).toLocaleString("ko-KR"):
new Date().toLocaleString("ko-KR");

setStatus(`저장 완료 · 다른 기기에서도 같은 링크로 확인할 수 있습니다 · ${updated}`);
}

$("loginForm").addEventListener("submit",async event=>{
event.preventDefault();

const email=$("email").value.trim();
const password=$("password").value;

setStatus("로그인 중입니다…");

const {error}=await db.auth.signInWithPassword({email,password});

if(error){
setStatus("로그인 실패: "+error.message,true);
return;
}

await checkAdmin();

if(isAdmin){
setStatus("관리자로 로그인했습니다. 명단과 공지사항을 수정할 수 있습니다.");
}else{
setStatus("로그인은 되었지만 관리자 권한이 없습니다. Supabase volunteer_admins 설정을 확인하세요.",true);
}
});

$("logoutBtn").addEventListener("click",async()=>{
await db.auth.signOut();
currentUser=null;
isAdmin=false;
renderAll();
setStatus("로그아웃했습니다. 현재는 읽기 전용입니다.");
});

$("saveBtn").addEventListener("click",savePlan);
$("reloadBtn").addEventListener("click",()=>loadPlan(true));

db.auth.onAuthStateChange(()=>{
setTimeout(async()=>{await checkAdmin();},0);
});

async function start(){
await checkAdmin();
await loadPlan();

db.channel("volunteer-plan-live")
.on("postgres_changes",{
event:"*",
schema:"public",
table:"volunteer_plan",
filter:"id=eq.1"
},async()=>{
await loadPlan(false);
})
.subscribe(state=>{
if(state==="SUBSCRIBED"){
setStatus("공유 자료 연결 완료 · 실시간 변경 알림 연결됨");
}else if(state==="CHANNEL_ERROR"||state==="TIMED_OUT"){
setStatus("공유 자료는 불러왔습니다. 실시간 알림 연결은 실패했습니다. 새로고침해 확인하세요.",true);
}
});
}

start().catch(error=>setStatus("시작 오류: "+error.message,true));
})();
</script>
</body>
</html>
