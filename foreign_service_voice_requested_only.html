<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>외국어 봉사 앱</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
  background:#f4f7fb;
  color:#111;
}
header{
  background:#123c69;
  color:white;
  padding:18px 14px;
  text-align:center;
}
header h1{margin:0;font-size:24px}
header p{margin:8px 0 0;font-size:14px;opacity:.9}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}
.tab{
  border:0;
  border-radius:14px;
  padding:14px 8px;
  font-size:17px;
  font-weight:800;
  background:white;
  color:#123c69;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.tab.active{background:#123c69;color:white}
.card{
  background:white;
  border-radius:18px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}
.num{
  display:inline-block;
  background:#e8f1fb;
  color:#123c69;
  font-weight:900;
  padding:5px 10px;
  border-radius:999px;
  margin-bottom:8px;
}
.ko{
  font-size:19px;
  font-weight:800;
  line-height:1.55;
  margin:8px 0;
}
.local{
  font-size:22px;
  line-height:1.7;
  margin:12px 0;
  padding:12px;
  background:#f7f9fc;
  border-radius:12px;
}
.pron{
  font-size:15px;
  color:#555;
  line-height:1.6;
  margin-top:8px;
}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.speak,button.copy,button.stop{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  font-size:16px;
  font-weight:800;
}
button.speak{background:#0b7a3b;color:white}
button.copy{background:#eceff3;color:#222}
button.stop{background:#c62828;color:white}
.notice{
  background:#fff6dc;
  border:1px solid #f1d38b;
  padding:12px;
  border-radius:14px;
  font-size:14px;
  line-height:1.6;
}
.footer{text-align:center;color:#666;font-size:13px;margin:20px 0}
</style>
</head>
<body>
<header>
  <h1>🌍 외국어 봉사 앱</h1>
  <p>네팔어 · 힌디어 · 벵골어 / 음성 듣기 포함</p>
</header>

<div class="wrap">
  <div class="tabs">
    <button class="tab active" onclick="selectLang('ne')">🇳🇵 네팔</button>
    <button class="tab" onclick="selectLang('hi')">🇮🇳 인도</button>
    <button class="tab" onclick="selectLang('bn')">🇧🇩 방글라데시</button>
  </div>

  <div class="notice">
    🔊 음성은 휴대폰/브라우저의 기본 음성 기능을 사용합니다. 해당 언어 음성이 설치되어 있으면 더 자연스럽게 들립니다.
  </div>

  <div id="cards"></div>

  <div class="footer">현장에서 상대방에게 보여주고 🔊 버튼을 눌러 사용할 수 있습니다.</div>
</div>

let current = "ne";

function selectLang(code){
  current = code;
  document.querySelectorAll(".tab").forEach((b,i)=>{
    b.classList.toggle("active", ["ne","hi","bn"][i]===code);
  });
  render();
}

function render(){
  const box = document.getElementById("cards");
  const langData = data[current];
  box.innerHTML = langData.items.map((item, idx)=>`
    <div class="card">
      <span class="num">${idx+1}</span>
      <div class="ko">${escapeHtml(item.ko)}</div>
      <div class="local">${escapeHtml(item.local)}</div>
      <div class="pron">한글 발음: ${escapeHtml(item.pron)}</div>
      <div class="btns">
        <button class="speak" onclick="speak(${idx})">🔊 ${langData.name} 듣기</button>
        <button class="copy" onclick="copyText(${idx})">📋 현지어 복사</button>
        <button class="stop" onclick="stopSpeak()">■ 정지</button>
      </div>
    </div>
  `).join("");
}

function speak(idx){
  if(!("speechSynthesis" in window)){
    alert("이 브라우저는 음성 읽기를 지원하지 않습니다.");
    return;
  }
  speechSynthesis.cancel();
  const langData = data[current];
  const text = langData.items[idx].local;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = langData.lang;
  utter.rate = 0.82;
  utter.pitch = 1;
  speechSynthesis.speak(utter);
}

function stopSpeak(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
}

function copyText(idx){
  const text = data[current].items[idx].local;
  navigator.clipboard.writeText(text).then(()=>{
    alert("복사되었습니다.");
  }).catch(()=>{
    alert("복사 기능을 사용할 수 없습니다.");
  });
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

render();
</script>

</html>
