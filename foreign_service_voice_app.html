<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>외국어 봉사 대화 앱</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;background:#f4f7fb;color:#1b1b1b}
header{background:#153b63;color:white;padding:18px 14px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:23px;line-height:1.25}
header p{margin:6px 0 0;font-size:14px;opacity:.9}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.lang-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.lang-tabs button{border:0;border-radius:14px;padding:13px 8px;font-size:16px;font-weight:800;background:#fff;color:#153b63;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.lang-tabs button.active{background:#153b63;color:#fff}
.notice{background:#fff7d6;border:1px solid #e6c85c;border-radius:14px;padding:12px;margin-bottom:14px;font-size:15px;line-height:1.55}
.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:14px;box-shadow:0 3px 14px rgba(0,0,0,.08);border:1px solid #e8edf3}
.card h2{font-size:18px;margin:0 0 10px;color:#153b63}
.ko{background:#eef5ff;border-radius:12px;padding:11px;font-size:17px;line-height:1.55;margin-bottom:10px}
.native{font-size:21px;line-height:1.6;font-weight:700;padding:10px 0;word-break:keep-all}
.pron{font-size:15px;line-height:1.5;color:#555;background:#f6f6f6;border-radius:10px;padding:10px;margin-top:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.action{border:0;border-radius:12px;padding:11px 13px;font-size:15px;font-weight:800;background:#153b63;color:white}
.action.secondary{background:#e9eef5;color:#153b63}
.action.stop{background:#9e2f2f;color:#fff}
.small{font-size:13px;color:#555;line-height:1.55;margin-top:8px}
.controls{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 3px 14px rgba(0,0,0,.08)}
.controls label{display:block;font-size:14px;font-weight:700;margin-bottom:7px;color:#153b63}
.controls input{width:100%}
footer{text-align:center;color:#666;font-size:13px;padding:20px 8px 35px}
@media(max-width:430px){header h1{font-size:21px}.lang-tabs button{font-size:15px;padding:12px 4px}.native{font-size:19px}.ko{font-size:16px}.action{flex:1}}
</style>
</head>
<body>
<header>
  <h1>🌍 외국어 봉사 대화 앱</h1>
  <p>네팔어 · 힌디어 · 벵골어 음성 듣기 포함</p>
</header>

<div class="wrap">
  <div class="lang-tabs">
    <button id="tab-ne" class="active" onclick="setLang('ne')">🇳🇵 네팔</button>
    <button id="tab-hi" onclick="setLang('hi')">🇮🇳 인도</button>
    <button id="tab-bn" onclick="setLang('bn')">🇧🇩 방글라데시</button>
  </div>

  <div class="notice">
    🔊 음성은 휴대폰/브라우저의 기본 읽기 기능을 사용합니다. 해당 언어 음성이 설치되어 있으면 더 자연스럽게 들립니다.
  </div>

  <div class="controls">
    <label for="speed">읽기 속도: <span id="speedText">0.85</span></label>
    <input id="speed" type="range" min="0.5" max="1.2" step="0.05" value="0.85" oninput="speedText.textContent=this.value">
    <div class="btn-row">
      <button class="action stop" onclick="stopSpeak()">■ 음성 정지</button>
      <button class="action secondary" onclick="speakAll()">▶ 전체 이어듣기</button>
    </div>
  </div>

  <main id="cards"></main>
</div>

<footer>
  현장에서 상대방에게 화면을 보여주거나 🔊 버튼을 눌러 들려줄 수 있습니다.
</footer>

<script>
const data = {
  ne: {
    name:'네팔어', lang:'ne-NP',
    items:[
      {title:'1. 인사와 자기소개', ko:'안녕하세요! 저는 성경을 하느님이 주신 책으로 믿는 여호와의 증인의 한 사람입니다.', native:'नमस्ते! म परमेश्वरले दिनुभएको पुस्तकको रूपमा बाइबलमा विश्वास गर्ने यहोवाको साक्षीहरूमध्ये एक हुँ।', pron:'나마스떼! 마 파르메슈월레 디누바예코 푸스타크코 루프마 바이벌마 비슈와스 가르네 예호바코 삭시하루마드예 엑 후.'},
      {title:'2. 성경을 읽어 보셨나요?', ko:'혹시 성경을 읽어 보신 적이 있나요?', native:'के तपाईंले कहिल्यै बाइबल पढ्नुभएको छ?', pron:'께 따빠이늘레 까힐레 바이벌 빠드누바예코 차?'},
      {title:'3. 성경이 알려 주는 것', ko:'성경은 우리가 살아가면서 생기는 중요한 질문들에 대한 답을 알려줍니다.', native:'बाइबलले जीवनका महत्त्वपूर्ण प्रश्नहरूको उत्तर दिन्छ।', pron:'바이벌레 지완카 마핫뜨와푸르나 프라슈나하루코 웃타르 딘차.'},
      {title:'4. 사람이 죽으면?', ko:'예를 들면, 사람이 죽으면 어떻게 되는가?', native:'उदाहरणका लागि, मानिस मरेपछि के हुन्छ?', pron:'우다하란카 라기, 마니스 마레파치 께 훈차?'},
      {title:'5. 하느님은 관심이 있으신가?', ko:'하느님은 우리가 살고 있는 세상과 사람들에 대해 관심이 있으신가?', native:'के परमेश्वरलाई हामी बसिरहेको संसार र मानिसहरूको चिन्ता छ?', pron:'께 파르메슈월라이 하미 바시라헤코 산사르 라 마니스하루코 친타 차?'},
      {title:'6. 무료 성경 공부 권유', ko:'괜찮으시다면 매주 한 번 10분 정도 무료로 성경을 알려드릴 수 있어요.', native:'यदि तपाईंलाई ठीक लाग्छ भने, हामी हप्तामा एक पटक करिब १० मिनेट जति निःशुल्क बाइबलबारे छलफल गर्न सक्छौं।', pron:'야디 따빠인라이 티크 락차 바네, 하미 합타마 엑 파탁 카립 다스 미닛 자티 니슐카 바이벌바레 찰팔 가르나 삭차우.'}
    ]
  },
  hi: {
    name:'힌디어', lang:'hi-IN',
    items:[
      {title:'1. 인사와 자기소개', ko:'안녕하세요! 저는 성경을 하느님이 주신 책으로 믿는 여호와의 증인의 한 사람입니다.', native:'नमस्ते! मैं यहोवा का एक साक्षी हूँ और मेरा विश्वास है कि बाइबल परमेश्वर द्वारा दी गई पुस्तक है।', pron:'나마스떼! 메인 예호바 카 엑 삭시 훈 아우르 메라 비슈와스 해 끼 바이벌 파르메슈와르 드와라 디 가이 푸스타크 해.'},
      {title:'2. 성경을 읽어 보셨나요?', ko:'혹시 성경을 읽어 보신 적이 있나요?', native:'क्या आपने कभी बाइबल पढ़ी है?', pron:'꺄 압네 카비 바이벌 빠디 해?'},
      {title:'3. 성경이 알려 주는 것', ko:'성경은 우리가 살아가면서 생기는 중요한 질문들에 대한 답을 알려줍니다.', native:'बाइबल जीवन के महत्वपूर्ण प्रश्नों के उत्तर देती है।', pron:'바이벌 지완 께 마핫뜨와푸른 프라슈논 께 웃타르 데티 해.'},
      {title:'4. 사람이 죽으면?', ko:'예를 들면, 사람이 죽으면 어떻게 되는가?', native:'उदाहरण के लिए, मरने के बाद क्या होता है?', pron:'우다하란 께 리예, 마르네 께 바드 꺄 호타 해?'},
      {title:'5. 하느님은 관심이 있으신가?', ko:'하느님은 우리가 살고 있는 세상과 사람들에 대해 관심이 있으신가?', native:'क्या परमेश्वर को हमारी और इस दुनिया की परवाह है?', pron:'꺄 파르메슈와르 꼬 하마리 아우르 이스 두니야 키 파르와 해?'},
      {title:'6. 무료 성경 공부 권유', ko:'괜찮으시다면 매주 한 번 10분 정도 무료로 성경을 알려드릴 수 있어요.', native:'अगर आपको ठीक लगे, तो हम सप्ताह में एक बार लगभग 10 मिनट के लिए निःशुल्क बाइबल के बारे में चर्चा कर सकते हैं।', pron:'아가르 압꼬 티크 라게, 또 함 삽타흐 멘 엑 바르 라그바그 다스 미닛 께 리예 니슐크 바이벌 께 바레 멘 차르차 카르 삭떼 해.'}
    ]
  },
  bn: {
    name:'벵골어', lang:'bn-BD',
    items:[
      {title:'1. 인사와 자기소개', ko:'안녕하세요! 저는 성경을 하느님이 주신 책으로 믿는 여호와의 증인의 한 사람입니다.', native:'নমস্কার! আমি যিহোবার একজন সাক্ষি। আমি বিশ্বাস করি, বাইবেল হলো ঈশ্বরের দেওয়া বই।', pron:'노모스카르! 아미 지호바르 엑존 샥키. 아미 비슈와스 코리, 바이벨 홀로 이슈워레르 데오아 보이.'},
      {title:'2. 성경을 읽어 보셨나요?', ko:'혹시 성경을 읽어 보신 적이 있나요?', native:'আপনি কি কখনও বাইবেল পড়েছেন?', pron:'압니 키 코코노 바이벨 포레첸?'},
      {title:'3. 성경이 알려 주는 것', ko:'성경은 우리가 살아가면서 생기는 중요한 질문들에 대한 답을 알려줍니다.', native:'বাইবেল জীবনের গুরুত্বপূর্ণ প্রশ্নগুলোর উত্তর দেয়।', pron:'바이벨 지보네르 구루또뿌르노 프로슈노굴로르 웃토르 데이.'},
      {title:'4. 사람이 죽으면?', ko:'예를 들면, 사람이 죽으면 어떻게 되는가?', native:'উদাহরণস্বরূপ, মানুষ মারা গেলে কী হয়?', pron:'우다호론쇼룹, 마누쉬 마라 겔레 키 호이?'},
      {title:'5. 하느님은 관심이 있으신가?', ko:'하느님은 우리가 살고 있는 세상과 사람들에 대해 관심이 있으신가?', native:'ঈশ্বর কি আমাদের এবং আমরা যে পৃথিবীতে বাস করি, সে সম্পর্কে সত্যিই যত্নশীল?', pron:'이슈워르 키 아마데르 에봉 암라 제 프리티비테 바스 코리, 세 솜포르케 쇼띠이 조트노실?'},
      {title:'6. 무료 성경 공부 권유', ko:'괜찮으시다면 매주 한 번 10분 정도 무료로 성경을 알려드릴 수 있어요.', native:'আপনার যদি আপত্তি না থাকে, তাহলে আমরা সপ্তাহে একবার প্রায় ১০ মিনিট বিনামূল্যে বাইবেল নিয়ে আলোচনা করতে পারি।', pron:'압나르 조디 아폿티 나 타케, 타홀레 암라 솝타헤 엑바르 프라이 도쉬 미닛 비나물레 바이벨 니예 알로초나 코르테 파리.'}
    ]
  }
};
let current = 'ne';
let queue = [];
function setLang(code){
  current = code;
  document.querySelectorAll('.lang-tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+code).classList.add('active');
  stopSpeak();
  renderCards();
}
function renderCards(){
  const box = document.getElementById('cards');
  box.innerHTML = data[current].items.map((item,idx)=>`
    <section class="card">
      <h2>${item.title}</h2>
      <div class="ko"><b>한국어</b><br>${item.ko}</div>
      <div class="native">${item.native}</div>
      <div class="pron"><b>한글 발음 참고</b><br>${item.pron}</div>
      <div class="btn-row">
        <button class="action" onclick="speakOne(${idx})">🔊 현지어 듣기</button>
        <button class="action secondary" onclick="copyText(${idx})">📋 문장 복사</button>
      </div>
    </section>`).join('');
}
function getRate(){return parseFloat(document.getElementById('speed').value || '0.85')}
function chooseVoice(lang){
  const voices = speechSynthesis.getVoices();
  return voices.find(v=>v.lang === lang) || voices.find(v=>v.lang && v.lang.startsWith(lang.split('-')[0])) || null;
}
function speakText(text, lang, onend){
  if(!('speechSynthesis' in window)){ alert('이 브라우저는 음성 읽기를 지원하지 않습니다.'); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = getRate();
  u.pitch = 1;
  const voice = chooseVoice(lang);
  if(voice) u.voice = voice;
  u.onend = onend || null;
  speechSynthesis.speak(u);
}
function speakOne(idx){
  stopSpeak(false);
  const item = data[current].items[idx];
  speakText(item.native, data[current].lang);
}
function speakAll(){
  stopSpeak(false);
  queue = data[current].items.map(i=>i.native);
  playNext();
}
function playNext(){
  if(queue.length===0) return;
  const text = queue.shift();
  speakText(text, data[current].lang, playNext);
}
function stopSpeak(clear=true){
  queue=[];
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
function copyText(idx){
  const item = data[current].items[idx];
  const text = `${item.ko}\n${item.native}`;
  navigator.clipboard.writeText(text).then(()=>alert('복사되었습니다.'));
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = ()=>speechSynthesis.getVoices(); }
renderCards();
</script>
</body>
</html>
